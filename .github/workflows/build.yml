name: Build iOS App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.0'
        channel: 'stable'
        
    - name: Create Flutter project
      run: |
        cd $GITHUB_WORKSPACE
        flutter create --org com.example --project-name bmi_calculator --platforms ios temp_flutter_app
        cp -r temp_flutter_app/ios .
        rm -rf temp_flutter_app
      
    - name: Get dependencies
      run: flutter pub get
      
    - name: Build iOS for simulator
      run: flutter build ios --simulator --no-codesign
      
    - name: Build iOS for release (needs signing)
      if: env.APPLE_CERTIFICATE != ''
      run: |
        echo "$APPLE_CERTIFICATE" | base64 --decode -o ios/Certificates.p12
        flutter build ipa --release --export-options-plist=export_options.plist
      env:
        APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        APPLE_PROFILE: ${{ secrets.APPLE_PROFILE }}
        
    - name: Upload iOS simulator app
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator-app
        path: build/ios/iphonesimulator/Runner.app
        retention-days: 30